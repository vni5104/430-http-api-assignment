<!DOCTYPE html>
<html lang="en">
<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  
  <script>
    const handleResponse = async (response) => {
      const content = document.querySelector("#content");

      switch (response.status) {
        case 200:
          content.innerHTML = `<b>Success</b>`;
          break;
        case 400:
          content.innerHTML = `<b>Bad Request</b>`;
          break;
        case 401:
          content.innerHTML = `<b>Unauthorized</b>`;
          break;
        case 403:
          content.innerHTML = `<b>Forbidden</b>`;
          break;
        case 500:
          content.innerHTML = `<b>Internal Server Error</b>`;
          break;
        case 501:
          content.innerHTML = `<b>Not Implemented</b>`;
          break;
        case 404:
          content.innerHTML = `<b>Resource Not Found</b>`;
          break;
        default: 
          content.innerHTML = `Error code not implemented by client.`;
          break;
      }

      const obj = await response.text();
      console.log(obj); //print raw JSON/XML to console
      
      let parsedObj;
      const parser = new DOMParser();

      const type = response.headers.get('content-type');
      if (type === 'text/xml') {
        parsedObj = parser.parseFromString(obj, 'text/xml');

        //console.log(parsedObj.getElementsByTagName("message")[0].innerHTML);
        if (parsedObj.getElementsByTagName('message')[0].innerHTML) {
          content.innerHTML += `<p>Message: ${parsedObj.getElementsByTagName('message')[0].innerHTML}</p>`;
        }
      } else {
        parsedObj = JSON.parse(obj);
        if (parsedObj.message) {
          content.innerHTML += `<p>Message: ${parsedObj.message}</p>`;
        }
      }
    };

    //Send request to server
    const sendRequest = async () => {
      const url = document.querySelector("#page").value;
      const type = document.querySelector("#type").value;

      const response = await fetch (url, {
        method: 'GET',
        headers: {
          Accept: type
        }
      });

      handleResponse(response);
    };

    const init = () => {
      const btnSend = document.querySelector("#send");
      btnSend.addEventListener('click', sendRequest);
    };

    window.onload = init;
  </script>
</head>
<body>
  <section id="top">
    <h3>Status Code Tests</h3>
    <select id="page">
      <option value="/success">Success</option>
      <option value="/badRequest">Bad Request</option>
      <option value="/unauthorized">Unauthorized</option>
      <option value="/forbidden">Forbidden</option>
      <option value="/internal">Internal</option>
      <option value="/notImplemented">Not Implemented</option>
      <option value="/notFound">Not Found</option>
    </select>
    <select id="type">
      <option value="application/json">JSON</option>
      <option value="text/xml">XML</option>
    </select>
    <button id="send">Send</button>
  </section>
  <section id="content">
  </section>
</body>
</html>
